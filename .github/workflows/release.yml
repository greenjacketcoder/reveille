name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Re-pushing an existing tag (e.g. after a history rewrite) re-triggers
  # this workflow; without this guard those re-runs die at the appcast
  # commit with a confusing non-fast-forward error. Skip cleanly instead.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check whether a release already exists for this tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists - skipping the release job (tag was re-pushed)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: precheck
    if: needs.precheck.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Not notarized yet (pending Apple Developer Program enrollment), so
      # this is ad-hoc signed for now. Once a Developer ID cert exists, swap
      # this step for real codesign + notarytool submission before packaging.
      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild build \
            -project MacAlert.xcodeproj -scheme MacAlert -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      - name: Read version from built app + verify it matches the tag
        id: version
        run: |
          APP="build/Build/Products/Release/Reveille.app"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          EXPECTED_TAG="v$SHORT"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $SHORT (expected tag $EXPECTED_TAG). Update the Xcode project version or use the matching tag."
            exit 1
          fi
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      # Runs early, before any step with side effects (appcast commit,
      # release publish): a missing changelog section fails the whole
      # release cleanly rather than leaving it half-done.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          python3 scripts/extract_changelog.py "${{ steps.version.outputs.short }}" > release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> release_notes.md

      - name: Package .dmg
        run: |
          mkdir -p staging
          cp -R "build/Build/Products/Release/Reveille.app" "staging/Reveille.app"
          ln -s /Applications staging/Applications
          hdiutil create -volname "Reveille" -srcfolder staging -ov -format UDZO \
            "Reveille-${{ steps.version.outputs.short }}.dmg"

      - name: Verify signature + disk image integrity
        run: |
          codesign --verify --deep --strict --verbose=2 "staging/Reveille.app"
          hdiutil verify "Reveille-${{ steps.version.outputs.short }}.dmg"

      - name: Download Sparkle CLI tools (pinned to the version this app embeds)
        run: |
          curl -fL -o sparkle-tools.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz
          echo "ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9  sparkle-tools.tar.xz" | shasum -a 256 -c - \
            || { echo "::error::Sparkle CLI tools checksum mismatch - possible tampering or a changed asset. Refusing to sign."; exit 1; }
          mkdir sparkle-tools
          tar -xf sparkle-tools.tar.xz -C sparkle-tools
      # The private key is never written to a file or logged; GitHub also
      # automatically redacts any exact match of a registered secret in logs.
      - name: Sign update with Sparkle (EdDSA)
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          DMG="Reveille-${{ steps.version.outputs.short }}.dmg"
          LENGTH=$(stat -f%z "$DMG")
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | sparkle-tools/bin/sign_update --ed-key-file - -p "$DMG")
          if [ -z "$SIGNATURE" ]; then
            echo "::error::Sparkle signing produced no signature - check SPARKLE_PRIVATE_KEY secret"
            exit 1
          fi
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Update appcast.xml
        run: |
          python3 scripts/update_appcast.py \
            --version "${{ steps.version.outputs.short }}" \
            --build "${{ steps.version.outputs.build }}" \
            --length "${{ steps.sign.outputs.length }}" \
            --signature "${{ steps.sign.outputs.signature }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Reveille-${{ steps.version.outputs.short }}.dmg" \
            --notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: Commit appcast.xml back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Release ${{ github.ref_name }}: update appcast.xml [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Reveille-${{ steps.version.outputs.short }}.dmg" \
            --title "Reveille ${{ steps.version.outputs.short }}" \
            --notes-file release_notes.md \
            --generate-notes
